<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ordered and Unordered Lists</title>
</head>
<body>
    <h1> We will study about Unordered Lists</h1>
    <div>
        <ul>
            <li>Shree Krishna</li>
            <li>Madhav</li>
            <li>Govind</li>
            <li>Achyut</li>
            <li>Mahabaho</li>
        </ul>
        <ul type="circle">
            <li>Shree Krishna</li>
            <li>Madhav</li>
            <li>Govind</li>
            <li>Achyut</li>
            <li>Mahabaho</li>
        </ul>
        <ul type="square">
            <li>Shree Krishna</li>
            <li>Madhav</li>
            <li>Govind</li>
            <li>Achyut</li>
            <li>Mahabaho</li>
        </ul>
    </div>
</body>
</html>
