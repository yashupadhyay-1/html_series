<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tag</title>
</head>
<body>
    <h1>using anchor tag with href(hyper reference)</h1>
    <a href="http://google.com">Click here</a>
    <h2>Now we will use target along with href which will allow us to open the link in new tab</h2>
    <a href="http://google.com" target="_blank">Click here</a>
</body>
</html>
